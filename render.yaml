services:
  - type: web
    name: makari-islamic-tv-api
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: makari-postgres
          property: connectionString

databases:
  - name: makari-postgres
    databaseName: makari_tv
    user: makari_admin
    plan: free
