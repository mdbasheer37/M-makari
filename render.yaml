# Render Blueprint — API (FastAPI) + PostgreSQL.
# Files live at the repo root, so there is NO rootDir here.
services:
  - type: web
    name: makari-islamic-tv-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: bash build.sh
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: makari-postgres
          property: connectionString
      # Set these in the Render dashboard (not committed):
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

databases:
  - name: makari-postgres
    databaseName: makari_tv
    user: makari_admin
    plan: free
